<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loba — Review queue</title>
<link rel="stylesheet" href="styles/loba.css">
</head>
<body>

<nav class="nav">
  <a href="dictionary.html" class="nav-logo">loba<span>.</span></a>
  <div class="nav-links">
    <a href="dictionary.html">Dictionary</a>
    <a href="leaderboard.html">Contributors</a>
    <a href="about.html">About</a>
    <a href="index.html" class="nav-contribute">Contribute</a>
  </div>
</nav>

<div class="page-wrap">
<div class="card wide-card">
  <p class="sub" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem;">Review queue</p>

  <div style="display: flex; gap: 8px; margin-bottom: 1.5rem;">
    <button class="queue-tab active" onclick="switchTab('pending', this)">
      Pending <span id="pending-count" style="font-size: 11px; background: #F5F0E8; padding: 2px 7px; border-radius: 10px; margin-left: 4px;"></span>
    </button>
    <button class="queue-tab" onclick="switchTab('flagged', this)">
      Flagged <span id="flagged-count" style="font-size: 11px; background: #F5F0E8; padding: 2px 7px; border-radius: 10px; margin-left: 4px;"></span>
    </button>
  </div>

  <div id="queue">
    <div class="loading">Loading...</div>
  </div>
</div>
</div>

<script>
const API_URL = "http://localhost:8080/api/v1/entries";
let currentTab = 'pending';

async function loadQueue(status) {
  const el = document.getElementById('queue');
  el.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const response = await fetch(`${API_URL}?status=${status}&rating=general&rating=mature&rating=restricted`);

    // fetch all ratings for review queue
    const r = await fetch(`${API_URL}?status=${status}`);
    if (!r.ok) throw new Error('Failed to load');
    const entries = await r.json();

    // update count badge
    document.getElementById(`${status}-count`).textContent = entries.length;

    if (entries.length === 0) {
      el.innerHTML = `<div class="empty-state">${
        status === 'pending'
          ? 'No pending entries. Queue is clear.'
          : 'No flagged entries.'
      }</div>`;
      return;
    }

    el.innerHTML = entries.map(entry => `
      <div class="entry-row" id="row-${entry.id}">
        <div class="entry-source">${escapeHtml(entry.source_text)}</div>
        <div class="entry-english">${escapeHtml(entry.english)}</div>
        <div class="entry-meta">
          ${entry.category ? `<span class="badge">${escapeHtml(entry.category)}</span>` : ''}
          ${entry.dialect ? `<span class="badge">${escapeHtml(entry.dialect)}</span>` : ''}
          ${entry.contributor_id ? `<span class="badge">contributor on record</span>` : ''}
        </div>
        ${entry.example_source ? `<div style="font-size:13px;font-style:italic;color:#1A1A18;margin-bottom:3px;">${escapeHtml(entry.example_source)}</div>` : ''}
        ${entry.example_english ? `<div style="font-size:13px;color:#6B6860;margin-bottom:8px;">${escapeHtml(entry.example_english)}</div>` : ''}
        ${entry.notes ? `<div style="font-size:12px;color:#6B6860;margin-bottom:8px;">${escapeHtml(entry.notes)}</div>` : ''}

        ${status === 'flagged' && entry.flag_reason ? `
          <div class="flag-reason-display">
            Flag reason: ${escapeHtml(entry.flag_reason)}
          </div>
        ` : ''}

        ${status === 'pending' ? `
        <div style="margin-bottom: 10px; padding: 10px 14px; background: #F5F0E8; border-radius: 8px;">
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #6B6860; font-weight: 500; margin-bottom: 6px;">Tiend wach e Dholuo (reviewer can add/edit before approving)</div>
            <textarea
              id="def-source-${entry.id}"
              style="width:100%;font-size:14px;padding:8px 10px;border:0.5px solid rgba(26,26,24,0.15);border-radius:8px;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:6px;"
              placeholder="Explain what this word means in Dholuo..."
            >${entry.definition_source ? escapeHtml(entry.definition_source) : ''}</textarea>
            <textarea
              id="def-english-${entry.id}"
              style="width:100%;font-size:14px;padding:8px 10px;border:0.5px solid rgba(26,26,24,0.15);border-radius:8px;font-family:inherit;resize:vertical;min-height:60px;"
              placeholder="English translation of the Dholuo definition..."
            >${entry.definition_english ? escapeHtml(entry.definition_english) : ''}</textarea>
          </div>
          <div style="margin-bottom: 8px;">
            <select id="rating-${entry.id}" style="font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 0.5px solid rgba(26,26,24,0.15); margin-bottom: 6px;">
              <option value="general">General — safe for all audiences</option>
              <option value="mature">Mature — valid but not for public dictionary</option>
              <option value="restricted">Restricted — private corpus only</option>
            </select>
            <textarea
              id="flag-reason-${entry.id}"
              class="flag-reason-input"
              placeholder="Flag reason (required when flagging)..."
              style="display:none;"
            ></textarea>
          </div>
          <div class="entry-actions">
            <button class="btn-approve" onclick="approveEntry('${entry.id}')">Approve</button>
            <button class="btn-flag" onclick="showFlagReason('${entry.id}')">Flag</button>
          </div>
        ` : `
          <div class="entry-actions">
            <button class="btn-approve" onclick="reopenEntry('${entry.id}')">Move to pending</button>
            <button class="btn-delete" onclick="deleteEntry('${entry.id}')">Delete permanently</button>
          </div>
        `}
      </div>
    `).join('');

  } catch (err) {
    el.innerHTML = `<div class="empty-state">Could not load: ${err.message}</div>`;
  }
}

function showFlagReason(id) {
  const textarea = document.getElementById(`flag-reason-${id}`);
  textarea.style.display = 'block';
  textarea.focus();
  // Replace flag button with confirm button
  const actions = textarea.closest('.entry-row').querySelector('.entry-actions');
  actions.innerHTML = `
    <button class="btn-approve" onclick="approveEntry('${id}')">Approve</button>
    <button class="btn-flag" onclick="confirmFlag('${id}')">Confirm flag</button>
    <button onclick="cancelFlag('${id}')" style="font-size:13px;background:none;border:none;color:#6B6860;cursor:pointer;">Cancel</button>
  `;
}

function cancelFlag(id) {
  const textarea = document.getElementById(`flag-reason-${id}`);
  textarea.style.display = 'none';
  const actions = textarea.closest('.entry-row').querySelector('.entry-actions');
  actions.innerHTML = `
    <button class="btn-approve" onclick="approveEntry('${id}')">Approve</button>
    <button class="btn-flag" onclick="showFlagReason('${id}')">Flag</button>
  `;
}

async function approveEntry(id) {
  const ratingEl = document.getElementById(`rating-${id}`);
  const rating = ratingEl ? ratingEl.value : 'general';
  const defSource = document.getElementById(`def-source-${id}`)?.value || '';
  const defEnglish = document.getElementById(`def-english-${id}`)?.value || '';
  await updateStatus(id, 'approve', rating, '', defSource, defEnglish);
}

async function confirmFlag(id) {
  const reasonEl = document.getElementById(`flag-reason-${id}`);
  const reason = reasonEl ? reasonEl.value.trim() : '';
  if (!reason) {
    alert('Please enter a reason for flagging this entry.');
    return;
  }
  await updateStatus(id, 'flag', 'general', reason);
}

async function reopenEntry(id) {
  await updateStatus(id, 'approve', 'general', '');
}

async function deleteEntry(id) {
  if (!confirm('Permanently delete this entry? This cannot be undone.')) return;
  try {
    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
    if (!response.ok) throw new Error('Delete failed');
    removeRow(id);
  } catch (err) {
    alert('Could not delete: ' + err.message);
  }
}

async function updateStatus(id, action, rating, flagReason, defSource, defEnglish) {
  try {
    const response = await fetch(`${API_URL}/${id}/${action}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        rating,
        flag_reason: flagReason,
        definition_source: defSource || '',
        definition_english: defEnglish || ''
      })
    });
    if (!response.ok) throw new Error('Update failed');
    removeRow(id);
    loadCounts();
  } catch (err) {
    alert('Could not update entry: ' + err.message);
  }
}
function removeRow(id) {
  const row = document.getElementById(`row-${id}`);
  if (row) {
    row.style.opacity = '0.3';
    setTimeout(() => {
      row.remove();
      if (document.querySelectorAll('.entry-row').length === 0) {
        document.getElementById('queue').innerHTML =
          `<div class="empty-state">${currentTab === 'pending' ? 'Queue is clear.' : 'No flagged entries.'}</div>`;
      }
    }, 200);
  }
}

async function loadCounts() {
  try {
    const [pendingRes, flaggedRes] = await Promise.all([
      fetch(`${API_URL}?status=pending`),
      fetch(`${API_URL}?status=flagged`)
    ]);
    const pending = await pendingRes.json();
    const flagged = await flaggedRes.json();
    document.getElementById('pending-count').textContent = pending.length;
    document.getElementById('flagged-count').textContent = flagged.length;
  } catch {}
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.queue-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadQueue(tab);
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

loadQueue('pending');
loadCounts();
</script>

</body>
</html>
